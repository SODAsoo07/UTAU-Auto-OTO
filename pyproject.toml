[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-auto-oto"
version = "5.0.0"
description = "Inventory-driven, acoustic-first OTO generator for UTAU/OpenUtau voicebanks"
requires-python = ">=3.10,<3.14"
dependencies = [
  "customtkinter>=5.2,<6",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
world = ["pyworld>=0.3.4,<1"]
neural = [
  "torch>=2.6,<2.7",
  "onnx>=1.17,<2",
  "onnxruntime-gpu>=1.20,<2",
]

[project.scripts]
universal-auto-oto = "universal_auto_oto.cli:main"
universal-auto-oto-ui = "universal_auto_oto.oto_generator_ui:main"
universal-auto-oto-preview = "universal_auto_oto.oto_preview:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
universal_auto_oto = ["profiles/*.yaml", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

schema_version: 1
pack_id: en_cz_vccv
display_name: English VCCV (CZ-SAMPA)
languages: [english, en]
formats: [vccv]
# Alignment profile the GUI uses for this pack. v17-v19 (activity level, speech span, nasal-frame
# model; fitted on Korean/Japanese) lowered English VCCV on all five hand-timed banks (2026-10-22,
# style-corrected pre<=30 -1 to -5.6 points), so English stays on v16.
alignment_profile: cvvc_slot_rhythm_v16
# CZ-SAMPA symbols differ only by case (a/A, e/E, i/I, o/O); phone ids below are
# lowercase-safe ARPAbet-style names because the project casefolds phone ids.
case_sensitive: true

# class: vowel | syllabic | consonant.  manner picks the HSMM state topology.
phones:
  aa: {class: vowel}            # a   father
  ae: {class: vowel}            # @   cat
  ah: {class: vowel}            # u   cut
  ao: {class: vowel}            # 9   thought
  eh: {class: vowel}            # e   bed
  er: {class: vowel}            # 3   bird
  ih: {class: vowel}            # i   bit
  iy: {class: vowel}            # E   beet
  uh: {class: vowel}            # 6   book
  uw: {class: vowel}            # o   boot
  ey: {class: vowel}            # A   day
  ow: {class: vowel}            # O   go
  ay: {class: vowel}            # I   my
  aw: {class: vowel}            # 8   now
  oy: {class: vowel}            # Q   boy
  ax: {class: vowel}            # x   ago
  ae_n: {class: vowel}          # &   @ before m/n
  ao_r: {class: vowel}          # 0   9 before r, O before l
  ih_ng: {class: vowel}         # 1   i before ng
  el: {class: syllabic, manner: liquid}
  em: {class: syllabic, manner: nasal}
  en: {class: syllabic, manner: nasal}
  eng: {class: syllabic, manner: nasal}
  b: {class: consonant, manner: stop, voiced: true}
  d: {class: consonant, manner: stop, voiced: true}
  g: {class: consonant, manner: stop, voiced: true}
  p: {class: consonant, manner: stop, voiced: false}
  t: {class: consonant, manner: stop, voiced: false}
  k: {class: consonant, manner: stop, voiced: false}
  q: {class: consonant, manner: stop, voiced: false}
  dx: {class: consonant, manner: tap, voiced: true}
  ch: {class: consonant, manner: affricate, voiced: false}
  jh: {class: consonant, manner: affricate, voiced: true}
  f: {class: consonant, manner: fricative, voiced: false}
  v: {class: consonant, manner: fricative, voiced: true}
  th: {class: consonant, manner: fricative, voiced: false}
  dh: {class: consonant, manner: fricative, voiced: true}
  s: {class: consonant, manner: fricative, voiced: false}
  z: {class: consonant, manner: fricative, voiced: true}
  sh: {class: consonant, manner: fricative, voiced: false}
  zh: {class: consonant, manner: fricative, voiced: true}
  h: {class: consonant, manner: fricative, voiced: false}
  hh: {class: consonant, manner: fricative, voiced: false}
  m: {class: consonant, manner: nasal, voiced: true}
  n: {class: consonant, manner: nasal, voiced: true}
  ng: {class: consonant, manner: nasal, voiced: true}
  l: {class: consonant, manner: liquid, voiced: true}
  r: {class: consonant, manner: liquid, voiced: true}
  w: {class: consonant, manner: glide, voiced: true}
  y: {class: consonant, manner: glide, voiced: true}

# Surface symbol -> phone id.  Longest match wins (sh before s, ng before n).
symbols:
  a: aa
  "@": ae
  u: ah
  "9": ao
  e: eh
  "3": er
  i: ih
  E: iy
  "6": uh
  o: uw
  A: ey
  O: ow
  I: ay
  "8": aw
  Q: oy
  x: ax
  "&": ae_n
  "0": ao_r
  "1": ih_ng
  ll: el
  mm: em
  nn: en
  nng: eng
  b: b
  d: d
  g: g
  p: p
  t: t
  k: k
  q: q
  dd: dx
  ch: ch
  j: jh
  f: f
  v: v
  th: th
  dh: dh
  s: s
  z: z
  sh: sh
  zh: zh
  h: h
  hh: hh
  m: m
  n: n
  ng: ng
  l: l
  r: r
  w: w
  y: y

# Lists record a syllabic consonant after a consonant as schwa + consonant
# (-ll__kxl: "_ll"/"ll-" are the x l of kxl).
alias_equivalents:
  el: [[ax, l]]
  em: [[ax, m]]
  en: [[ax, n]]
  eng: [[ax, ng]]
  # n before k/g is [ng]: lists spell it n (-bAnk), aliases ng (bAng).
  ng: [[n]]

filename:
  separators: "_+ "
  # A leading consonant-only token without a start marker groups the list
  # (l_k@l_k@l, ng__k1ngz_k1ngz); it is not recorded.
  drop_unmarked_consonant_prefix: true
  # Trailing dashes keep A/a, E/e ... apart on case-insensitive file systems.
  strip_trailing: "-"
  start_markers: "-_"

alias:
  head_marker: "-"
  after_consonant_marker: "_"
  end_marker: "-"
  # "b@" names the mid-phrase CV; the file-start take is "-b@".
  unmarked_consonant_start_avoids_file_start: true

# Alias shape -> template.  Shapes: optional marker, groups of V (vowel or
# syllabic) and C joined by spaces, optional trailing end marker.  First
# matching rule wins.
shape_templates:
  - {shape: "-C+V+C*", template: cv_head, role: cv_head}
  - {shape: "_C+V+C*", template: cv_after_consonant, role: cv}
  - {shape: "C+V+C*", template: cv, role: cv}
  - {shape: "-V+C*", template: v_head, role: v_head}
  - {shape: "_V+C*", template: v_after_consonant, role: v}
  - {shape: "V-", template: release, role: release}
  - {shape: "V", template: v, role: v}
  - {shape: "VV+C*", template: vv, role: vv}
  - {shape: "VC+-", template: vc_end, role: vc}
  - {shape: "VC+", template: vc, role: vc}
  - {shape: "V C", template: vc_onset, role: vc}
  - {shape: "V CC+", template: vc_onset_cluster, role: vc}
  - {shape: "V+C* C+", template: vcc, role: vc}
  - {shape: "V C+ C+", template: vcc, role: vc}
  - {shape: "C+ C+", template: cc, role: cc}
  - {shape: "-C+", template: cc_head, role: cc_head}
  - {shape: "_C+", template: cc_cluster, role: cc}
  - {shape: "C+-", template: cc_end, role: cc}
  - {shape: "C+", template: cc_cluster, role: cc}

# Anchors in ms from the file start.  phone[i] indexes the alias' own phones
# (phone[-1] = last); nucleus = first vowel/syllabic phone; group_start[k] =
# first phone of the k-th space-separated alias group; before / after = the
# recording's phone just outside the alias.  The preutterance sits
# on an acoustic landmark; the other anchors keep the list's usual spacing
# around it (medians of a hand-timed CZ VCCV bank).
templates:
  cv_head:
    role: cv_head
    anchors:
      pre_abs: fallback(nucleus.vowel_onset, nucleus.vowel_transition + 15, nucleus.start + 15)
      offset_abs: min(phone[0].start - 30, pre_abs - 40)
      overlap_abs: max(offset_abs, min(phone[0].start, pre_abs - 20))
      fixed_abs: pre_abs + 60
      cutoff_abs: fixed_abs + 190
  cv:
    role: cv
    anchors:
      pre_abs: fallback(nucleus.vowel_onset, nucleus.vowel_transition + 12, nucleus.start + 12)
      offset_abs: min(phone[0].start, pre_abs - 30)
      overlap_abs: min(offset_abs + 30, pre_abs - 10)
      fixed_abs: pre_abs + 60
      cutoff_abs: fixed_abs + 150
  cv_after_consonant:
    role: cv
    anchors:
      pre_abs: fallback(nucleus.vowel_onset, nucleus.vowel_transition + 35, nucleus.start + 35)
      offset_abs: pre_abs - 30
      overlap_abs: pre_abs - 15
      fixed_abs: pre_abs + 90
      cutoff_abs: fixed_abs + 280
  v_head:
    role: v_head
    anchors:
      pre_abs: fallback(nucleus.vowel_transition, nucleus.start)
      offset_abs: pre_abs - 37
      overlap_abs: pre_abs - 19
      fixed_abs: pre_abs + 60
      cutoff_abs: min(phone[-1].end, fixed_abs + 394)
  v_after_consonant:
    role: v
    anchors:
      pre_abs: nucleus.start + 77
      offset_abs: pre_abs - 30
      overlap_abs: pre_abs - 15
      fixed_abs: pre_abs + 60
      cutoff_abs: fixed_abs + 133
  v:
    role: v
    anchors:
      offset_abs: nucleus.start + 100
      overlap_abs: offset_abs + 150
      pre_abs: offset_abs + 300
      fixed_abs: offset_abs + 350
      cutoff_abs: offset_abs + 600
  release:
    role: release
    anchors:
      pre_abs: min(phone[0].end, phone[0].start + 245)
      offset_abs: pre_abs - 175
      overlap_abs: pre_abs - 99
      fixed_abs: pre_abs + 69
      cutoff_abs: fixed_abs + 76
  vv:
    role: vv
    anchors:
      # Vowel-to-vowel glides have no sharp acoustic edge; all three hand-timed banks
      # put the change one guide beat (~530 ms) after the first vowel starts.
      pre_abs: clamp(phone[0].start + 530, phone[0].start + 150, max(phone[0].start + 150, phone[-1].end - 60))
      offset_abs: pre_abs - 371
      overlap_abs: pre_abs - 200
      fixed_abs: pre_abs + 94
      cutoff_abs: fixed_abs + 302
  vc:
    role: vc
    anchors:
      # Into a sonorant the voice glides on: the transition starts before the aligned end;
      # a sonorant + obstruent coda (1ngz, arb) is heard at the obstruent.
      pre_abs: fallback(phone[2].start - 15, phone[0].end - 60) if phone[1].features.sonorant == True else (phone[0].end + 30) if (phone[1].features.manner == 'fricative' and phone[1].features.voiced == True) else (fallback(phone[0].vowel_offset, phone[0].end) + 44)
      offset_abs: pre_abs - 240
      overlap_abs: pre_abs - 128
      fixed_abs: pre_abs + 60
      cutoff_abs: fixed_abs + 35
  vc_end:
    role: vc
    anchors:
      pre_abs: fallback(phone[2].start - 15, phone[0].end - 60) if phone[1].features.sonorant == True else (phone[0].end + 30) if (phone[1].features.manner == 'fricative' and phone[1].features.voiced == True) else (fallback(phone[0].vowel_offset, phone[0].end) + 58)
      offset_abs: pre_abs - 238
      overlap_abs: pre_abs - 129
      fixed_abs: pre_abs + 95
      cutoff_abs: fixed_abs + 75
  vc_onset:
    role: vc
    anchors:
      pre_abs: (phone[0].end) if (phone[1].features.manner == 'fricative' and phone[1].features.voiced == True) else (fallback(phone[0].vowel_offset, phone[0].end) + 17)
      offset_abs: pre_abs - 300
      overlap_abs: pre_abs - 150
      fixed_abs: pre_abs + 200
      cutoff_abs: fixed_abs + 200
  vc_onset_cluster:
    role: vc
    anchors:
      pre_abs: group_start[1].start + 42
      offset_abs: pre_abs - 300
      overlap_abs: pre_abs - 150
      fixed_abs: pre_abs + 231
      cutoff_abs: fixed_abs + 183
  vcc:
    role: vc
    anchors:
      pre_abs: group_start[1].start - 10
      offset_abs: pre_abs - 326
      overlap_abs: pre_abs - 178
      fixed_abs: pre_abs + 200
      cutoff_abs: fixed_abs + 100
  cc:
    role: cc
    anchors:
      pre_abs: group_start[1].start - 24
      offset_abs: pre_abs - 68
      overlap_abs: pre_abs - 30
      fixed_abs: pre_abs + 400
      cutoff_abs: fixed_abs + 200
  cc_head:
    role: cc_head
    anchors:
      pre_abs: fallback(phone[-1].vowel_transition, phone[-1].start + 60) + 16
      offset_abs: min(phone[0].start - 30, pre_abs - 77)
      overlap_abs: offset_abs + 32
      fixed_abs: pre_abs + 83
      cutoff_abs: fixed_abs + 191
  cc_cluster:
    role: cc
    anchors:
      # Mid-phrase onset cluster (bl, skr): heard where the following vowel starts.
      pre_abs: fallback(after.vowel_onset, after.vowel_transition, phone[-1].end) if after.features.vowel_like == True else fallback(phone[1].start - 12, phone[0].start + 40)
      offset_abs: pre_abs - 112
      overlap_abs: pre_abs - 60
      fixed_abs: pre_abs + 81
      cutoff_abs: fixed_abs + 42
  cc_end:
    role: cc
    anchors:
      pre_abs: phone[0].start + 10
      offset_abs: pre_abs - 116
      overlap_abs: pre_abs - 63
      fixed_abs: pre_abs + 171
      cutoff_abs: fixed_abs + 92

# Default labeler style: ms added to each anchor, the median (hand - generated)

# generated with the 70 Hz rumble high-pass.
# Keys: "shape|class" (class of the consonant at the vowel boundary) before "shape".
# Labelers differ; `fit-style` learns a user's own style from their hand OTO.
style:
  "-CC": {rows: 99, offset: 78.5, overlap: 83.2, pre: -14.7, fixed: -32.5, cutoff: -14.3}

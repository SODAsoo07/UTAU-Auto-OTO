name: Build Windows (preview)

on:
  workflow_dispatch:

jobs:
  build-windows-preview:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Fetch LFS Objects (preview)
        shell: pwsh
        run: |
          git lfs pull --include="ML_models/**,ML_models_preview/**"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
            requirements-preview.txt

      - name: Cache Nuitka Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-${{ runner.os }}-py311-preview-${{ hashFiles('requirements.txt', 'requirements-ml.txt', 'requirements-preview.txt', 'build.py', 'main.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py311-preview-
            nuitka-${{ runner.os }}-py311-

      - name: Cache FFmpeg Runtime
        uses: actions/cache@v4
        with:
          path: |
            build_assets\ffmpeg
          key: ffmpeg-runtime-${{ runner.os }}-${{ hashFiles('build.py') }}
          restore-keys: |
            ffmpeg-runtime-${{ runner.os }}-

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary -r requirements-ml.txt
          pip install --no-build-isolation -r requirements-preview.txt
          pip install nuitka ordered-set zstandard

      - name: Build App (preview)
        shell: pwsh
        timeout-minutes: 70
        run: |
          $suppress = 'Nuitka-Inclusion: Writing cache for dependencies of .* ignoring\.'
          python -u build.py --name UTAU_Auto_OTO --backend nuitka --skip-deps --channel "preview" 2>&1 |
            ForEach-Object {
              if ($_ -notmatch $suppress) { $_ }
            }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer (preview)
        shell: pwsh
        run: |
          pwsh -File scripts/build_installer.ps1 -Channel "preview" -SourceDir "UTAU_Auto_OTO_Release_preview"

      - name: Build Portable Zip (preview, with ML_models)
        shell: pwsh
        run: |
          pwsh -File scripts/build_portable_with_models.ps1 -Channel "preview" -SourceDir "UTAU_Auto_OTO_Release_preview" -OutputZip "portable_output/UTAU_Auto_OTO_portable_with_models_preview.zip"

      - name: Upload Portable Artifact (preview)
        uses: actions/upload-artifact@v4
        with:
          name: UTAU_Auto_OTO_windows_portable_preview
          path: UTAU_Auto_OTO_Release_preview/**
          if-no-files-found: error

      - name: Upload Portable Zip With Models (preview)
        uses: actions/upload-artifact@v4
        with:
          name: UTAU_Auto_OTO_windows_portable_with_models_preview
          path: portable_output/UTAU_Auto_OTO_portable_with_models_preview.zip
          if-no-files-found: error

      - name: Upload Installer Artifact (preview)
        uses: actions/upload-artifact@v4
        with:
          name: UTAU_Auto_OTO_windows_setup_preview
          path: installer_output/UTAU_Auto_OTO_Setup_*_preview.exe
          if-no-files-found: error
